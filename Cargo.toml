[package]
name = "oneloop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Exact Symbolica expressions for one-loop integrals"
publish = false # Development snapshot: dependency patches and licensing approval remain open.

[features]
default = ["prebuilt"]
prebuilt = []

[dependencies]
# Do not impose Symbolica's optional global mimalloc allocator on embedding hosts.
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "fb845d34bda8ccf1fedef6544d3aa46dc24944e3", default-features = false, features = ["tracing_max_level_info", "integer-gmp", "float-mpfr", "native_code_generation", "bincode"] }

[patch.crates-io]
symjit = { path = "../symjit-2.24.1-patched" }
graphica = { path = "../symbolica-dev-v3/lib/graphica" }
numerica = { path = "../symbolica-dev-v3/lib/numerica" }

# Local evaluator and transcendental fixes; remove after upstream includes them.
[patch."https://github.com/symbolica-dev/symbolica"]
symbolica = { path = "../symbolica-dev-v3" }
