[package]
name = "oneloop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Exact Symbolica expressions for one-loop integrals"
publish = false # Development snapshot: licensing approval remains open.

[features]
default = ["prebuilt"]
# Opt into ahead-of-time Rust evaluators instead of the smaller interpreted hooks.
generated-evaluators = []
prebuilt = []
# Reuse the exact Symbolica instruction-to-Rust emitter and its numeric runtime.
rust-codegen = []

[[example]]
name = "generate_native"
required-features = ["rust-codegen"]

[[example]]
name = "rows_survey"
required-features = ["generated-evaluators"]

[dependencies]
# Do not impose Symbolica's optional global mimalloc allocator on embedding hosts.
symbolica = { version = "3.0.1", default-features = false, features = ["tracing_max_level_info", "integer-gmp", "float-mpfr", "native_code_generation", "bincode"] }
bincode = "2.0"
# Limb access for the fused double-double kernels (already required by Symbolica).
xprec = "0.2.3"
# Compatible backend updates are selected by the consuming Cargo.lock.
symjit = "2.27.3"

[patch.crates-io]
# Symbolica: symbolica-dev/symbolica `community` 36cbac3a plus the consolidated upstream PR
# (branch ValentinHirschi/symbolica pyamplicol/pin-community-36cbac3a), the one revision shared by
# pyAmpliCol, NinjaRS and OneLoop. OneLoop itself needs only the upstream community API.
# Keep all three packages on one source; embedding hosts supply their own patch.
symbolica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "a558dfaed8f198dfc4c3652dfb9fe0f7c65b0505" }
numerica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "a558dfaed8f198dfc4c3652dfb9fe0f7c65b0505" }
graphica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "a558dfaed8f198dfc4c3652dfb9fe0f7c65b0505" }
