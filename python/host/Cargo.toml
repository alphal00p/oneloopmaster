[package]
name = "oneloop-symbolica-host"
version = "0.1.0"
edition = "2024"
description = "Single-kernel Symbolica Python development host for OneLOop"
publish = false

[lib]
name = "core"
crate-type = ["cdylib"]

[features]
default = ["prebuilt"]
prebuilt = ["oneloop-python/prebuilt"]
generated-evaluators = ["oneloop-python/generated-evaluators"]

[dependencies]
oneloop-python = { path = "..", default-features = false, features = ["community"] }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
symbolica = { version = "3.0.1", default-features = false, features = ["python_export", "tracing_max_level_info", "integer-gmp", "float-mpfr", "native_code_generation", "bincode"] }

[patch.crates-io]
# Use the current upstream Symbolica community API.
# Keep all three packages on one source; embedding hosts supply their own patch.
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "f514a7fe1b19e851207f9421ef9a4a4157d5f0e5" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "f514a7fe1b19e851207f9421ef9a4a4157d5f0e5" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "f514a7fe1b19e851207f9421ef9a4a4157d5f0e5" }
