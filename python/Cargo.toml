[package]
name = "oneloop-python"
version = "0.1.0"
edition = "2024"
description = "Thin numeric and shared-kernel community Python adapters for oneloop"
publish = false

[lib]
name = "oneloop_native"
crate-type = ["rlib", "cdylib"]

[features]
default = ["extension-module", "prebuilt"]
prebuilt = ["oneloop/prebuilt"]
generated-evaluators = ["oneloop/generated-evaluators"]
extension-module = ["pyo3/extension-module", "pyo3/abi3-py39"]
community = ["symbolica/python_export"]

[dependencies]
oneloop = { path = "..", default-features = false }
pyo3 = "0.28"
symbolica = { version = "3.0.1", default-features = false, features = ["tracing_max_level_info", "integer-gmp", "float-mpfr", "native_code_generation", "bincode"] }

[patch.crates-io]
# Use the current upstream Symbolica community API.
# Keep all three packages on one source; embedding hosts supply their own patch.
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "f514a7fe1b19e851207f9421ef9a4a4157d5f0e5" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "f514a7fe1b19e851207f9421ef9a4a4157d5f0e5" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "f514a7fe1b19e851207f9421ef9a4a4157d5f0e5" }
